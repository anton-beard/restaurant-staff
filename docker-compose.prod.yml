# Продакшен: приложение за Caddy с автоматическим HTTPS.
# Нужен домен, A-запись которого указывает на сервер, и переменная DOMAIN в .env.
# Перед первым запуском: mkdir -p data && chown 1000:1000 data (контейнер работает от uid 1000).
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
